# BangTunes Configuration File
# Copy this to ~/.config/bangtunes.toml (global) or ./bangtunes.toml (project-local).
# A local file takes precedence when both exist.

# Default audio format for downloads (opus, mp3, m4a)
format = "opus"

# Default minimum score for fuzzy matching (0-100)
min_score = 58

# Default batch size (tracks per batch file)
size = 50

# Directories the Rust TUI player scans for audio files.
# Each entry is an absolute path string.
music_directories = [
    "~/Music",
]

# Download behaviour
[download]
format = "opus"      # opus | mp3 | m4a
quality = "best"     # best | medium | low
speed = "normal"     # normal | fast | stealth  (stealth adds delays to avoid rate-limiting)

# Listening-behaviour tracking (used by smart shuffle weighting)
[behavior]
min_play_time_for_tracking = 30   # seconds before a listen is counted
weight_decay_days = 30            # days until an unplayed track is fully boosted

# Player defaults (Rust TUI)
[player]
volume = 0.7     # 0.0–1.0
shuffle = false
repeat = false
